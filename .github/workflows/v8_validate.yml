name: V8 reporting pilot validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  source-and-packet-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent PDF parser
        run: python -m pip install PyMuPDF==1.26.7
      - name: Verify retained V8 outputs and frozen pre-V8 evidence
        run: python scripts/build_v8_pilot.py --check
      - name: Test product-specific source contracts and deliberate corruption fixtures
        run: python tests/check_v8_pilot.py --sources
