name: Reusable read-only validation
on:
  workflow_call:
    inputs:
      group:
        description: Exact validation group from metadata/validation_groups.json
        required: true
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  validate:
    name: ${{ inputs.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve declared environment
        id: environment
        env:
          VALIDATION_GROUP: ${{ inputs.group }}
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          groups=json.loads(Path('metadata/validation_groups.json').read_text())['groups']
          group=os.environ['VALIDATION_GROUP']
          if group not in groups: raise SystemExit('Unknown validation group')
          definition=groups[group]
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('requires_r='+str(definition['requires_r']).lower()+'\n')
          PY
      - uses: r-lib/actions/setup-r@v2
        if: steps.environment.outputs.requires_r == 'true'
        timeout-minutes: 5
        with:
          use-public-rspm: true
      - name: Install exact group dependencies
        env:
          VALIDATION_GROUP: ${{ inputs.group }}
        run: |
          python - <<'PY'
          import json,os,re,subprocess,sys
          from pathlib import Path
          groups=json.loads(Path('metadata/validation_groups.json').read_text())['groups']
          packages=groups[os.environ['VALIDATION_GROUP']]['python_packages']
          if not all(re.fullmatch(r'[A-Za-z0-9_-]+==[0-9][A-Za-z0-9.]*',p) for p in packages):
              raise SystemExit('Dependencies must be exactly pinned')
          if packages: subprocess.run([sys.executable,'-m','pip','install',*packages],check=True)
          PY
      - name: Execute explicit acceptance group
        env:
          VALIDATION_GROUP: ${{ inputs.group }}
        run: python scripts/run_validation_suite.py --group "$VALIDATION_GROUP" --receipt "/tmp/validation-$VALIDATION_GROUP.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ inputs.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/validation-${{ inputs.group }}.json
          if-no-files-found: warn
          retention-days: 30
