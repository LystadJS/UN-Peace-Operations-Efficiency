name: V9 Cyprus production-transfer acceptance (manual candidate only)
permissions:
  contents: read
concurrency:
  group: v9-cyprus-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true
    - name: Install pinned source parsers
      run: |
        python -m pip install pypdf==5.9.0 PyMuPDF==1.26.7 beautifulsoup4==4.14.3 PyYAML==6.0.3
        mkdir -p /tmp/v9-acceptance
        python -m pip freeze > /tmp/v9-acceptance/python-requirements.txt
        git rev-parse HEAD > /tmp/v9-acceptance/input-commit.txt
    - name: Generate reviewed design and recover exact retained originals
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python scripts/build_v9_design.py
        python - <<'PY'
        import hashlib, io, json, os, zipfile
        from pathlib import Path
        from urllib.request import Request, build_opener, HTTPRedirectHandler, urlopen
        from urllib.error import HTTPError
        from urllib.parse import urlsplit
        design_path = Path('data/census_v9/reviewed_design.json')
        assert hashlib.sha256(design_path.read_bytes()).hexdigest() == '4878dbbe77344be458ac948ada7de6124c44c8f575351af2835489ff88262dd7'
        design = json.loads(design_path.read_text())
        class NoRedirect(HTTPRedirectHandler):
            def redirect_request(self, req, fp, code, msg, headers, newurl):
                return None
        api = 'https://api.github.com/repos/LystadJS/UN-Peace-Operations-Efficiency/actions/artifacts/11977253134/zip'
        request = Request(api, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'})
        try:
            with build_opener(NoRedirect()).open(request, timeout=60) as response:
                payload = response.read(64000001)
        except HTTPError as error:
            if error.code not in (301,302,303,307,308):
                raise
            location = error.headers['Location']
            assert urlsplit(location).scheme == 'https'
            # Never forward the API credential to artifact storage.
            with urlopen(Request(location), timeout=90) as response:
                payload = response.read(64000001)
        assert len(payload) <= 64000000
        expected = '400b3ce4b040a4c30f69c30844d95ab664c333556a2371cef8eca3feb2cd2479'
        assert hashlib.sha256(payload).hexdigest() == expected
        receipt=[]
        with zipfile.ZipFile(io.BytesIO(payload)) as archive:
            assert archive.testzip() is None
            for source in design['sources']:
                hits=[n for n in archive.namelist() if n.endswith('/'+source['sha256']+'.pdf')]
                assert len(hits)==1, (source['source_id'],len(hits))
                body=archive.read(hits[0])
                assert body.startswith(b'%PDF') and hashlib.sha256(body).hexdigest()==source['sha256']
                target=Path(source['file']); target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(body)
                receipt.append({'source_id':source['source_id'],'sha256':source['sha256'],'artifact_member':hits[0]})
        Path('/tmp/v9-acceptance/source-recovery.json').write_text(json.dumps({'artifact_id':11977253134,'artifact_sha256':expected,'sources':receipt},indent=2)+'\n')
        PY
    - name: Build Cyprus views and run source and corruption tests
      run: python scripts/v9_cyprus.py --build --check --test
    - name: Run explicit retained validation suite and release-specific guards
      run: |
        python scripts/run_validation_suite.py --group baseline --receipt /tmp/v9-acceptance/retained-suite.json
        python scripts/build_v8_pilot.py --check
        python tests/check_v8_pilot.py --sources
        python scripts/v9_cyprus.py --check
    - name: Recheck candidate Cyprus views without publishing
      run: python scripts/v9_cyprus.py --check
    - name: Retain reproducible package and acceptance receipts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: v9-validated-cyprus-transfer
        retention-days: 30
        include-hidden-files: true
        path: '/tmp/v9-acceptance

          README.md

          data

          docs

          scripts

          tests

          .github/workflows/validate.yml

          .github/workflows/v9_release.yml

          '
    permissions:
      contents: read
      actions: read
'on':
  workflow_dispatch: {}
