name: Additional Mission and Training Archive Frame (manual candidate only)
permissions:
  contents: read
concurrency:
  group: additional-un-mission-training-source-frame
  cancel-in-progress: false
jobs:
  source-index-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install pinned HTML parser
      run: python -m pip install beautifulsoup4==4.12.3
    - name: Check official-source and no-event-inference guards
      run: python tests/check_extended_archive_frame.py
    - name: Collect bounded pages of nine additional UN archive and training sources
      run: python scripts/collect_extended_official_archive.py --max-pages 3 --workers 4
    - name: Retain candidate outputs for review only
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: additional_mission_training_frame-candidate-only
        retention-days: 14
        path: 'data

          docs

          '
    permissions:
      contents: read
      actions: read
'on':
  workflow_dispatch: {}
