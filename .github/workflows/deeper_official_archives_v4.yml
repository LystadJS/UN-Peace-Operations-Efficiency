name: Deeper Official Mission and Training Archive Frame (manual candidate only)
permissions:
  contents: read
concurrency:
  group: peace-operations-deep-archive-v4
  cancel-in-progress: false
jobs:
  deep-index-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install pinned public source parser
      run: python -m pip install beautifulsoup4==4.12.3
    - name: Revalidate official-source URL and no-event rules
      run: python tests/check_extended_archive_frame.py
    - name: Collect bounded deeper pages without promoting listings to events
      run: python scripts/collect_deeper_archive_frame_v4.py --pages 8
    - name: Retain candidate outputs for review only
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: deeper_official_archives_v4-candidate-only
        retention-days: 14
        path: 'data

          docs

          '
    permissions:
      contents: read
      actions: read
'on':
  workflow_dispatch: {}
