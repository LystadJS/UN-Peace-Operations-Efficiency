name: Systematic Security Council Census Snapshot (manual candidate only)
permissions:
  contents: read
jobs:
  harvest-official-public-index:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install reproducible HTML extraction dependency
      run: python -m pip install "beautifulsoup4==4.12.3"
    - name: Fetch Security Council report and formal meeting index snapshots
      run: python scripts/build_systematic_census.py --output-dir data --minimum-2025-meetings 255 --minimum-2026-meetings
        110
    - name: Check census integrity, completeness and fiscal cut-off
      run: python scripts/validate_systematic_census.py
    - name: Retain candidate outputs for review only
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: systematic_census-candidate-only
        retention-days: 14
        path: 'data

          docs

          '
    permissions:
      contents: read
      actions: read
'on':
  workflow_dispatch: {}
