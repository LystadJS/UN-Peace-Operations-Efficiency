name: Cross-version census audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source parsers
        run: python -m pip install pypdf==6.1.1 beautifulsoup4==4.13.4
      - name: Record exact baseline
        run: git rev-parse HEAD > BASELINE_COMMIT.txt
      - name: Capture public original sources
        run: |
          python scripts/collect_census_v6_sources.py
          python scripts/recover_census_v6_sources.py
      - name: Preserve reproducible public repository and source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-version-census-audit
          retention-days: 30
          include-hidden-files: true
          path: |
            BASELINE_COMMIT.txt
            README.md
            data
            docs
            scripts
            tests
            v6_raw_sources
            .github/workflows/validate.yml
