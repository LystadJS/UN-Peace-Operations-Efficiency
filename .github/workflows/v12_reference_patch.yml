name: V12 additive reference patch (manual candidate only)
permissions:
  contents: read
concurrency:
  group: v12-reference-patch
  cancel-in-progress: false
jobs:
  candidate-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true
    - name: Install and record source-check environment
      run: |
        python -m pip install PyMuPDF==1.26.7 pypdf==5.9.0 beautifulsoup4==4.14.3 PyYAML
        mkdir -p /tmp/v12_acceptance
        python -m pip freeze > /tmp/v12_acceptance/requirements.txt
        git rev-parse HEAD > /tmp/v12_acceptance/tested_commit.txt
    - name: Prepare only absent candidate outputs or verify existing outputs
      run: |
        if [ -f data/census_v12/patch_summary.json ]; then
          python scripts/prepare_v12_patch.py --check --source-check
        else
          python scripts/prepare_v12_patch.py --build --source-check
        fi
        python tests/check_v12_patch.py 2>&1 | tee /tmp/v12_acceptance/patch_tests.txt
    - name: Run explicit retained validation suite and release-specific guards
      run: |
        python scripts/run_validation_suite.py --group baseline --receipt /tmp/v12_acceptance/retained_suite.json
        python scripts/rehearse_v11.py --check
        python tests/check_v11_tabletop.py
        Rscript tests/check_v11_tabletop.R
        python tests/check_v10_protocol.py
        Rscript tests/check_v10_workload.R
    - name: Verify all pre-V12 tracked files remain byte-identical
      run: |
        python - <<'PY'
        import json,subprocess
        from pathlib import Path
        from scripts.frozen_audit_inputs import frozen_source_path
        base='2e8d5c6303d677f4c7fd797d6cd679309ce69f9d'
        names=subprocess.check_output(['git','ls-tree','-r','--name-only',base],text=True).splitlines()
        for name in names:
            old=subprocess.check_output(['git','show',base+':'+name])
            if frozen_source_path(Path.cwd(),name).read_bytes()!=old: raise AssertionError(name)
        Path('/tmp/v12_acceptance/frozen_files.json').write_text(json.dumps({'baseline':base,'all_prior_tracked_files_unchanged':len(names)},indent=2)+'\n')
        PY
    - name: Retain public candidate package and test evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: v12-reference-correction-candidate
        retention-days: 30
        include-hidden-files: true
        path: '/tmp/v12_acceptance

          data

          docs

          scripts

          tests

          README.md

          .github/workflows

          '
    permissions:
      contents: read
      actions: read
'on':
  workflow_dispatch: {}
