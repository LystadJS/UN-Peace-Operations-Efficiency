name: Systematic 2025-2026 Evidence Views (manual candidate only)
permissions:
  contents: read
jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Build time-correct activity/output register and source completeness matrix
      run: python scripts/build_systematic_unified_views.py
    - name: Verify Council index, mission news, 55 activity records and financial abstentions
      run: python scripts/validate_phase11_systematic.py
    - name: Retain candidate outputs for review only
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: systematic_evidence_views-candidate-only
        retention-days: 14
        path: 'data

          docs

          '
    permissions:
      contents: read
      actions: read
'on':
  workflow_dispatch: {}
