name: Cross-version census audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/census_v6.yml
      - scripts/collect_census_v6_sources.py
      - scripts/audit_census_v6.py
      - data/census_v6/review_decisions.json
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF text extractor
        run: python -m pip install pypdf==6.1.1
      - name: Record exact baseline
        run: git rev-parse HEAD > BASELINE_COMMIT.txt
      - name: Capture public original sources
        run: python scripts/collect_census_v6_sources.py
      - name: Preserve reproducible public repository and source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-version-census-audit
          retention-days: 30
          include-hidden-files: true
          path: |
            BASELINE_COMMIT.txt
            README.md
            data
            docs
            scripts
            tests
            v6_raw_sources
            .github/workflows/validate.yml
