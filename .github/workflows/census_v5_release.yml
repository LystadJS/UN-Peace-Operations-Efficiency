name: October 15 census final acceptance (manual candidate only)
permissions:
  contents: read
concurrency:
  group: public-census-v5-release
  cancel-in-progress: false
jobs:
  final-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true
    - name: Install and record parsing environment
      run: |
        python -m pip install beautifulsoup4 PyYAML
        mkdir -p /tmp/census-v5-release-html
        python -m pip freeze > /tmp/census-v5-release-html/python-requirements.txt
    - name: Finalize canonical identities and current research entry points
      run: python scripts/finalize_census_v5.py --write
    - name: Run explicit retained validation suite and release-specific guards
      run: |
        python scripts/run_validation_suite.py --group baseline --receipt /tmp/census-v5-release-html/acceptance-receipt.json
    - name: Retain verified research package and acceptance receipt
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: public-census-v5-final-acceptance
        retention-days: 14
        path: '/tmp/census-v5-release-html

          README.md

          data/census_v5

          docs/census_2025_2026_oct15_v5.md

          docs/census_2025_2026_oct15_executive.md

          scripts/collect_census_v5.py

          scripts/validate_census_v5.py

          scripts/finalize_census_v5.py

          '
    permissions:
      contents: read
      actions: read
'on':
  workflow_dispatch: {}
