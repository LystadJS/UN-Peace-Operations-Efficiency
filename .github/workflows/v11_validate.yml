name: V11 tabletop integrity guards
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tabletop-and-closed-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Validate retained first-pass results and closed live-use gates
        run: |
          python scripts/rehearse_v11.py --check
          python tests/check_v11_tabletop.py
          python scripts/build_v10_protocol.py --check
      - name: Validate synthetic accounting without live observations
        run: Rscript tests/check_v11_tabletop.R
