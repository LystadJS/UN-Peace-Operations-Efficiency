name: Public portfolio release acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact clean-commit public portfolio acceptance plan
        run: python -B scripts/run_portfolio_checks.py --receipt "${{ runner.temp }}/public-portfolio-acceptance.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-portfolio-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-portfolio-acceptance.json
          if-no-files-found: error
          retention-days: 30
