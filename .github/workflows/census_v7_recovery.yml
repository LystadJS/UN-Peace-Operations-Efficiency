name: V7 transcript recovery (manual candidate only)
permissions:
  contents: read
concurrency:
  group: census-v7-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned document parsers
      run: python -m pip install pypdf==5.9.0 beautifulsoup4==4.14.3
    - name: Preserve initial failed acceptance record
      uses: actions/download-artifact@v4
      with:
        name: census-v7-recovered-transcripts
        run-id: 38749354731
        github-token: ${{ github.token }}
        path: /tmp/v7-first-pass
    - name: Recover exact official records and authenticate every page
      run: |
        mkdir -p data/census_v7/history
        cp /tmp/v7-first-pass/data/census_v7/recovery_attempts.csv data/census_v7/history/first_attempts.csv
        cp /tmp/v7-first-pass/data/census_v7/recovery_summary.json data/census_v7/history/first_summary.json
        python scripts/recover_census_v7_layout.py --collect
    - name: Preserve prior frozen acceptance controls
      run: |
        python scripts/validate_census_v5.py
        python scripts/finalize_census_v5.py --check
        python scripts/audit_census_v6.py --check
    - name: Retain original records and source receipts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: census-v7-recovered-transcripts
        retention-days: 30
        path: 'data/census_v7

          scripts/recover_census_v7_transcripts.py

          scripts/recover_census_v7_layout.py

          V7_RECOVERY_COMMIT.txt

          '
    permissions:
      contents: read
      actions: read
'on':
  workflow_dispatch: {}
