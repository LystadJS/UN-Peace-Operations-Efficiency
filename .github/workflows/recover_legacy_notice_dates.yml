name: Recover Authenticated Notice Dates

on:
  push:
    paths:
      - scripts/backfill_census_legacy_dates.py
      - .github/workflows/recover_legacy_notice_dates.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: recover-legacy-notice-dates
  cancel-in-progress: false

jobs:
  authenticated-date-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed public HTML parser
        run: python -m pip install beautifulsoup4==4.12.3
      - name: Recover archived original bytes from verified workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/un-peace-census-legacy
          gh run download 38314738551 -R "${{ github.repository }}" -n public-source-html-census-v2 -D /tmp/un-peace-census-legacy
          test "$(find /tmp/un-peace-census-legacy -name '*.html' | wc -l)" -ge 688
      - name: Verify original fingerprints and recover article header dates
        run: python scripts/backfill_census_legacy_dates.py --html-dir /tmp/un-peace-census-legacy
      - name: Preserve only public metadata, not source HTML copies
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/census_v2/legacy_date_recovery.csv data/census_v2/union_dated_notice_coverage.csv data/census_v2/legacy_date_recovery_summary.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: Recover and authenticate publication dates from original public HTML'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
