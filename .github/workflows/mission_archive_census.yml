name: Mission News Archive Metadata Snapshot (manual candidate only)
permissions:
  contents: read
jobs:
  bounded-official-mission-news:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install fixed HTML parsing dependency
      run: python -m pip install "beautifulsoup4==4.12.3"
    - name: Collect official mission and DPPA/DPO notice archives with error accounting
      run: python scripts/build_mission_archive_metadata.py --output-dir data --max-pages 14
    - name: Verify notice metadata vs completeness status
      run: python scripts/validate_mission_archive_metadata.py
    - name: Classify archive notice titles only (not an actual event census)
      run: |
        python scripts/classify_mission_archive_metadata.py
        python scripts/validate_mission_archive_candidates.py
    - name: Retain candidate outputs for review only
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mission_archive_census-candidate-only
        retention-days: 14
        path: 'data

          docs

          '
    permissions:
      contents: read
      actions: read
'on':
  workflow_dispatch: {}
