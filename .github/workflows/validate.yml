name: Crosswalk validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  structural-quality-gates:
    uses: ./.github/workflows/reusable_validation.yml
    with:
      group: baseline
  repository-controls:
    uses: ./.github/workflows/reusable_validation.yml
    with:
      group: repository-controls
  retained-whitepaper:
    uses: ./.github/workflows/reusable_validation.yml
    with:
      group: retained-whitepaper
