name: Recover Authenticated Notice Dates (manual candidate only)
permissions:
  contents: read
concurrency:
  group: recover-legacy-notice-dates
  cancel-in-progress: false
jobs:
  authenticated-date-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install fixed public HTML parser
      run: python -m pip install beautifulsoup4==4.12.3
    - name: Recover archived original bytes from verified workflow run
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p /tmp/un-peace-census-legacy
        gh run download 38314738551 -R "${{ github.repository }}" -n public-source-html-census-v2 -D /tmp/un-peace-census-legacy
        test "$(find /tmp/un-peace-census-legacy -name '*.html' | wc -l)" -ge 688
    - name: Verify original fingerprints and recover article header dates
      run: python scripts/backfill_census_legacy_dates.py --html-dir /tmp/un-peace-census-legacy
    - name: Retain candidate outputs for review only
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: recover_legacy_notice_dates-candidate-only
        retention-days: 14
        path: 'data

          docs

          '
    permissions:
      contents: read
      actions: read
'on':
  workflow_dispatch: {}
